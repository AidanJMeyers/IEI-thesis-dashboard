name: Deploy dashboard to GitHub Pages

# The Pages build is a static export running in Local Mode: it seeds itself from
# context/*.json and stores each visitor's edits in their own browser. That makes
# it a safe, always-available read of the plan with no database and no secrets.
# The shared, writable deployment is the Vercel one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /IEI-thesis-dashboard
        run: pnpm exec next build

      # Without this, GitHub Pages runs Jekyll, which silently drops the
      # _next/ directory and the whole app 404s on its own assets.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
