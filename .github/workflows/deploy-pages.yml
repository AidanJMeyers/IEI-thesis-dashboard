name: Deploy redirect to GitHub Pages

# GitHub Pages used to serve a static export of the dashboard. That build had no
# database credentials, so it always rendered the plan as originally seeded —
# visually identical to the live dashboard but permanently frozen. Two URLs that
# look the same and disagree is a trap, especially for committee members.
#
# Pages now serves a redirect to the live Vercel deployment, preserving the path.
# Nothing is built here, so this finishes in seconds.

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

      - id: deployment
        uses: actions/deploy-pages@v4
